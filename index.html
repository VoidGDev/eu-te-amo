<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Amo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    let width, height;
    let coreParticles = []; 
    let stardust = [];      
    let time = 0;
    
    // --- SISTEMA DE FRASES ROMÂNTICAS (Sem espaço/constelações) ---
    const romanticPhrases = [
        "Você é o meu pensamento favorito todos os dias.",
        "Em cada batida, o meu coração chama o seu.",
        "Meu lugar favorito no mundo é dentro do seu abraço.",
        "Você transformou o meu silêncio em uma linda canção.",
        "Amar você é a coisa mais fácil que eu já fiz.",
        "Você é a resposta para todas as minhas orações.",
        "Não existe distância que apague o que eu sinto por você.",
        "Meu futuro só faz sentido se você estiver nele.",
        "Você é o meu porto seguro em qualquer tempestade.",
        "Se eu pudesse pedir um desejo, seria acordar ao seu lado todos os dias."
    ];
    
    let currentPhraseIndex = 0;
    let phraseOpacity = 0;
    let phraseState = 'waiting'; // 'waiting', 'fadeIn', 'hold', 'fadeOut'
    let phraseTimer = 0;
    let heartFormedProgress = 0; 

    const COLORS = [
        "#ffffff", "#e0f2fe", "#bae6fd", "#7dd3fc", 
        "#38bdf8", "#0ea5e9", "#3b82f6", "#2563eb", "#1d4ed8", "#00ffff"
    ];

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initStardust();
    }
    window.addEventListener('resize', resize);

    function getHeartPoint(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        return { x, y };
    }

    class Stardust {
        constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 1.5;
            this.speedY = Math.random() * 0.5 + 0.1;
            this.opacity = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.y -= this.speedY;
            if (this.y < 0) {
                this.y = height;
                this.x = Math.random() * width;
            }
        }
        draw() {
            ctx.fillStyle = `rgba(150, 200, 255, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.startX = width / 2 + (Math.random() - 0.5) * 600; 
            this.startY = height + 100;
            this.x = this.startX;
            this.y = this.startY;
            
            const t = Math.random() * Math.PI * 2;
            const heartPoint = getHeartPoint(t);
            const scale = Math.min(width, height) * 0.03; 
            
            this.z = Math.random(); 
            const innerSpread = (Math.random() - 0.5) * 25 * this.z;

            this.targetX = width / 2 + heartPoint.x * scale * (1 + this.z * 0.3) + innerSpread;
            this.targetY = height / 2 + heartPoint.y * scale * (1 + this.z * 0.3) + innerSpread;

            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            this.radius = (Math.random() * 1.5 + 0.5) * (1 + this.z * 1.5);
            
            this.vx = 0;
            this.vy = 0;
            this.progress = Math.random() * -3; 
            this.speed = Math.random() * 0.015 + 0.005;
            this.angle = Math.random() * Math.PI * 2;
            this.spin = (Math.random() - 0.5) * 0.05;
            this.isFormed = false;
            this.history = [];
        }

        update(mouseX, mouseY) {
            if (!this.isFormed) {
                this.progress += this.speed;
                const easeOut = 1 - Math.pow(1 - this.progress, 5); 
                
                const noiseX = Math.sin(this.progress * 15 + time) * 50 * (1 - easeOut);
                const noiseY = Math.cos(this.progress * 15 + time) * 50 * (1 - easeOut);
                
                this.x = this.startX + (this.targetX - this.startX) * easeOut + noiseX;
                this.y = this.startY + (this.targetY - this.startY) * easeOut + noiseY;

                if (this.progress >= 1) {
                    this.isFormed = true;
                }
            } else {
                this.angle += this.spin;
                const beat = Math.pow(Math.sin(time * 5), 12) * 30 * this.z; 
                
                const targetX = this.targetX + Math.cos(this.angle) * beat;
                const targetY = this.targetY + Math.sin(this.angle) * beat;

                const driftX = Math.sin(time * 2 + this.angle) * 3;
                const driftY = Math.cos(time * 1.5 + this.angle) * 3;

                const forceX = (targetX + driftX - this.x) * 0.08;
                const forceY = (targetY + driftY - this.y) * 0.08;

                this.vx += forceX;
                this.vy += forceY;

                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 200) {
                    const force = (200 - dist) / 200;
                    this.vx += (dx / dist) * force * 15;
                    this.vy += (dy / dist) * force * 15;
                }

                this.vx *= 0.8;
                this.vy *= 0.8;
                this.x += this.vx;
                this.y += this.vy;

                if (this.z > 0.4) {
                    this.history.push({x: this.x, y: this.y});
                    if (this.history.length > 6) this.history.shift();
                }
            }
        }

        draw() {
            if (this.history.length > 1) {
                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                for (let i = 1; i < this.history.length; i++) {
                    ctx.lineTo(this.history[i].x, this.history[i].y);
                }
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = 0.15 * this.z;
                ctx.lineWidth = this.radius * 0.8;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            
            ctx.globalAlpha = 0.3 + (this.z * 0.7);
            ctx.shadowBlur = 20 * this.z;
            ctx.shadowColor = this.color;
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.globalAlpha = this.z;
            ctx.shadowBlur = 10;
            ctx.fill();

            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }
    }

    let mouseX = width / 2;
    let mouseY = height / 2;

    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    function initStardust() {
        stardust = [];
        for (let i = 0; i < 300; i++) {
            stardust.push(new Stardust());
        }
    }

    const PARTICLE_COUNT = 1000; 
    
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        coreParticles.push(new Particle());
    }

    function drawConnections() {
        ctx.lineWidth = 0.4;
        let formedCount = 0;
        coreParticles.forEach(p => { if(p.isFormed) formedCount++; });
        if (formedCount < PARTICLE_COUNT * 0.5) return;

        for (let i = 0; i < coreParticles.length; i += 3) { 
            const p1 = coreParticles[i];
            if (!p1.isFormed) continue;

            for (let j = i + 3; j < coreParticles.length; j += 3) {
                const p2 = coreParticles[j];
                if (!p2.isFormed) continue;

                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 35) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    
                    const beatGlow = Math.pow(Math.sin(time * 5), 2) * 0.3;
                    const opacity = (1 - dist / 35) * (0.15 + beatGlow) * Math.min(p1.z, p2.z);
                    
                    ctx.strokeStyle = `rgba(56, 189, 248, ${opacity})`;
                    ctx.stroke();
                }
            }
        }
    }

    function updateAndDrawPhrases() {
        let formedCount = 0;
        coreParticles.forEach(p => { if(p.isFormed) formedCount++; });
        heartFormedProgress = formedCount / PARTICLE_COUNT;

        // Só começa a mostrar frases se 85% do coração já estiver formado
        if (heartFormedProgress < 0.85) return;

        if (phraseState === 'waiting') {
            phraseState = 'fadeIn';
            phraseOpacity = 0;
            phraseTimer = 0;
        } else if (phraseState === 'fadeIn') {
            phraseOpacity += 0.02;
            if (phraseOpacity >= 1) {
                phraseOpacity = 1;
                phraseState = 'hold';
            }
        } else if (phraseState === 'hold') {
            phraseTimer += 1;
            // Tempo na tela um pouco maior para ler a frase com calma (aprox 3.5 segundos)
            if (phraseTimer > 210) { 
                phraseState = 'fadeOut';
            }
        } else if (phraseState === 'fadeOut') {
            phraseOpacity -= 0.02;
            if (phraseOpacity <= 0) {
                phraseOpacity = 0;
                currentPhraseIndex = (currentPhraseIndex + 1) % romanticPhrases.length;
                phraseState = 'waiting';
            }
        }

        if (phraseOpacity > 0) {
            ctx.save();
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // Fonte ajustada para telas menores
            let fontSize = Math.min(width * 0.045, 30);
            if (width < 600) fontSize = 18; 

            ctx.font = `italic ${fontSize}px "Georgia", serif`;
            
            ctx.shadowColor = "#38bdf8";
            ctx.shadowBlur = 20 + Math.sin(time * 5) * 10; 
            ctx.fillStyle = `rgba(255, 255, 255, ${phraseOpacity})`;
            
            const scale = 0.95 + (phraseOpacity * 0.05);
            // Posiciona a frase abaixo do coração
            ctx.translate(width / 2, height / 2 + Math.min(height * 0.3, 200)); 
            ctx.scale(scale, scale);
            
            ctx.fillText(romanticPhrases[currentPhraseIndex], 0, 0);
            
            ctx.restore();
        }
    }

    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
        ctx.fillRect(0, 0, width, height);

        time += 0.02;

        const auraRadius = 200 + Math.sin(time * 5) * 40; 
        const auraGradient = ctx.createRadialGradient(
            width/2, height/2, 0, 
            width/2, height/2, auraRadius
        );
        auraGradient.addColorStop(0, 'rgba(29, 78, 216, 0.15)');
        auraGradient.addColorStop(0.5, 'rgba(59, 130, 246, 0.05)');
        auraGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = auraGradient;
        ctx.fillRect(0, 0, width, height);

        stardust.forEach(s => {
            s.update();
            s.draw();
        });

        coreParticles.forEach(p => {
            p.update(mouseX, mouseY);
        });

        drawConnections();

        coreParticles.sort((a, b) => a.z - b.z).forEach(p => {
            p.draw();
        });

        updateAndDrawPhrases();

        requestAnimationFrame(animate);
    }

    resize();
    animate();
    
    window.addEventListener('click', () => {
        coreParticles.forEach(p => p.reset());
        phraseState = 'waiting';
        phraseOpacity = 0;
        currentPhraseIndex = 0;
        phraseTimer = 0;
    });

</script>

</body>
</html>
